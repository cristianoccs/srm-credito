services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creditengine
      POSTGRES_USER: creditengine
      POSTGRES_PASSWORD: creditengine
    ports:
      - "5432:5432"
    volumes:
      - creditengine-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditengine -d creditengine"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/creditengine
      DB_USERNAME: creditengine
      DB_PASSWORD: creditengine
      DB_DRIVER: org.postgresql.Driver
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  creditengine-data:
