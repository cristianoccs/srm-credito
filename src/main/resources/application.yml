spring:
  application:
    name: srm-credit-engine
  datasource:
    url: ${DB_URL:jdbc:h2:mem:creditengine;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  h2:
    console:
      enabled: false

server:
  port: ${PORT:3000}
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

credit-engine:
  pricing:
    base-rate: ${BASE_RATE:0.0100}
    scale: 2
    rounding-mode: HALF_EVEN
